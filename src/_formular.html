<form class="formular" method="post" {% if site.formular.endpoint and not site.formular.demo %}action="{{ site.formular.endpoint }}"{% endif %} data-endpoint="{{ site.formular.endpoint }}" data-demo="{{ 1 if site.formular.demo or not site.formular.endpoint else 0 }}">
  <label>Meno <input name="meno" autocomplete="name" required></label>
  <label>E-mail <input name="email" type="email" autocomplete="email" required></label>
  <label>Telefón <input name="telefon" type="tel" autocomplete="tel"></label>
  <label>Správa <textarea name="sprava" rows="5" required placeholder="Typ podujatia, miesto, termín, počet účastníkov"></textarea></label>
  <div class="past" aria-hidden="true"><label>Nevyplňovať <input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
  <input type="hidden" name="_subject" value="{{ site.formular.predmet }}">
  <label class="suhlas"><input type="checkbox" name="suhlas" required> Súhlasím so spracovaním osobných údajov</label>
  <button type="submit">Odoslať správu</button>
  <p class="formular-stav" role="status" aria-live="polite"></p>
</form>
